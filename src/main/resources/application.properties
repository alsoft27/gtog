spring.application.name=gtog
app.auth.auto-verify-email=false
app.auth.verification-ttl=PT24H
app.auth.verify-email-path=/verify-email
app.auth.mail-cooldown=PT5M
app.auth.mail-max-per-day=5
app.auth.mail-executor.core-size=2
app.auth.mail-executor.max-size=4
app.auth.mail-executor.queue-capacity=100
app.invitations.max-sends-per-guest=3
app.invitations.min-interval=PT1H
app.invitations.max-sends-per-host-per-day=100
app.invitations.max-batch=20
app.invitations.max-whatsapp-links-per-request=100
app.mail.from=${MAIL_FROM:}
app.mail.from-name=gtog
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:4200}
spring.mail.host=in-v3.mailjet.com
spring.mail.port=587
spring.mail.username=${MAILJET_API_KEY:}
spring.mail.password=${MAILJET_SECRET_KEY:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false
management.health.mail.enabled=false
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=gtog_dev
management.endpoint.health.show-details=always
management.health.mongodb.enabled=false
spring.devtools.restart.enabled=false
spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*
logging.level.sun.rmi=OFF
